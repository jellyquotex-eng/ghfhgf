<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Self-hosted vertical video · clean embed</title>

  <style>
    /* ============================================
       Global reset & premium dark theme
       ============================================ */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(1200px 800px at 50% 12%, rgba(212, 172, 91, 0.18), transparent 38%),
        radial-gradient(900px 600px at 50% 100%, rgba(73, 116, 171, 0.12), transparent 40%),
        #070a0d;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem;
      color: #edf1f5;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================
       FULL-SCREEN VIDEO SECTION
       100vw × 100dvh, fixed visuals inside
       ============================================ */
    .fullscreen-video-section {
      position: relative;
      width: 100vw;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      isolation: isolate;
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
      margin-top: -1.5rem;
      margin-bottom: -1.5rem;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        inset 0 0 60px rgba(0, 0, 0, 0.8),
        0 28px 60px rgba(0, 0, 0, 0.38);
    }

    .fullscreen-video-section::before,
    .fullscreen-video-section::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .fullscreen-video-section::before {
      background:
        linear-gradient(180deg, rgba(5, 8, 12, 0.7) 0%, rgba(5, 8, 12, 0.08) 18%, rgba(5, 8, 12, 0.28) 100%),
        radial-gradient(120% 80% at 50% 42%, rgba(22, 28, 36, 0.12), transparent 60%);
    }

    .fullscreen-video-section::after {
      inset: 2.5% 2.5% auto auto;
      width: 30vmin;
      height: 30vmin;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(220, 185, 102, 0.22), transparent 64%);
      filter: blur(32px);
      opacity: 0.8;
    }

    .fullscreen-video-section video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      pointer-events: none;
    }

    .fs-fill {
      object-fit: cover;
      filter: blur(28px) brightness(0.45) saturate(0.9);
      transform: scale(1.1);
      opacity: 0;
    }

    .fs-sharp {
      object-fit: cover;
      z-index: 1;
    }

    @media (min-width: 700px) {
      .fs-fill { opacity: 1; }
      .fs-sharp { object-fit: contain; }
    }

    .fs-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(
          120% 80% at 50% 50%,
          rgba(0, 0, 0, 0.1) 0%,
          rgba(0, 0, 0, 0.58) 100%
        );
    }

    /* ============================================
       BIG CENTERED PLAY BUTTON
       High-end soft-glass glow
       ============================================ */
    .big-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6.75rem;
      height: 6.75rem;
      border-radius: 50%;
      border: 1px solid rgba(234, 198, 118, 0.48);
      background:
        linear-gradient(145deg, rgba(37, 40, 47, 0.9), rgba(12, 14, 18, 0.72));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #f8f2de;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      z-index: 5;
      box-shadow:
        0 0 0 0 rgba(234, 198, 118, 0.26),
        0 18px 40px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition:
        opacity 0.35s ease,
        transform 0.35s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      animation: bigPlayPulse 2.8s ease-out infinite;
    }

    .big-play:hover,
    .big-play:focus-visible {
      background: linear-gradient(145deg, rgba(52, 57, 66, 0.95), rgba(17, 20, 25, 0.78));
      border-color: rgba(234, 198, 118, 0.72);
      box-shadow:
        0 0 0 10px rgba(234, 198, 118, 0.08),
        0 18px 40px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      outline: none;
    }

    .big-play:active {
      transform: translate(-50%, -50%) scale(0.96);
    }

    .big-play svg {
      width: 2.9rem;
      height: 2.9rem;
      fill: currentColor;
      margin-left: 7px;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(255, 227, 163, 0.35));
    }

    .big-play.is-hidden {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.9);
      pointer-events: none;
      animation: none;
    }

    @keyframes bigPlayPulse {
      0% {
        box-shadow:
          0 0 0 0 rgba(234, 198, 118, 0.26),
          0 18px 40px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      70% {
        box-shadow:
          0 0 0 24px rgba(234, 198, 118, 0),
          0 18px 40px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      100% {
        box-shadow:
          0 0 0 0 rgba(234, 198, 118, 0),
          0 18px 40px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
    }

    /* ============================================
       CORNER CONTROLS (appear on tap/hover, auto-hide)
       ============================================ */
    .corner-controls {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      display: flex;
      gap: 0.6rem;
      z-index: 6;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      background: rgba(18, 20, 25, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 0.45rem 0.5rem;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    .fullscreen-video-section.controls-visible .corner-controls,
    .fullscreen-video-section:hover .corner-controls {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .control-btn {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(22, 24, 30, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 3rem;
      width: 3rem;
      height: 3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #f4f7fb;
      cursor: pointer;
      padding: 0;
      font-size: 0;
      line-height: 1;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 6px 18px rgba(0, 0, 0, 0.28);
      transition: background 0.15s ease, transform 0.15s ease,
        border-color 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .control-btn:hover,
    .control-btn:focus-visible {
      background: rgba(39, 42, 49, 0.88);
      border-color: rgba(224, 187, 110, 0.45);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 8px 20px rgba(0, 0, 0, 0.34);
      transform: scale(1.05);
      outline: none;
    }

    .control-btn:active {
      transform: scale(0.96);
    }

    .control-btn svg {
      width: 1.4rem;
      height: 1.4rem;
      fill: currentColor;
      display: block;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }

    /* ============================================
       Fallback message
       ============================================ */
    .video-fallback {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #dfe7f1;
      background: rgba(18, 23, 30, 0.9);
      padding: 1.2rem 1.6rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      line-height: 1.5;
      text-align: center;
      width: 88%;
      max-width: 380px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.45);
      z-index: 7;
    }

    .fullscreen-video-section.fallback-active video,
    .fullscreen-video-section.fallback-active .big-play,
    .fullscreen-video-section.fallback-active .corner-controls {
      display: none;
    }

    .fullscreen-video-section.fallback-active .video-fallback {
      display: block;
    }

    /* ============================================
       Small-screen refinements
       ============================================ */
    @media (max-width: 480px) {
      body { padding: 0.75rem; }
      .big-play {
        width: 5.4rem;
        height: 5.4rem;
      }
      .big-play svg {
        width: 2.3rem;
        height: 2.3rem;
        margin-left: 5px;
      }
      .corner-controls {
        right: 0.75rem;
        bottom: 0.75rem;
        gap: 0.5rem;
        padding: 0.38rem 0.42rem;
      }
      .control-btn {
        width: 2.75rem;
        height: 2.75rem;
      }
      .control-btn svg {
        width: 1.25rem;
        height: 1.25rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .big-play,
      .control-btn,
      .corner-controls,
      .fullscreen-video-section video {
        animation: none !important;
        transition: none;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================
       FULL-SCREEN VIDEO SECTION
       - Blurred, darkened fill (desktop sides)
       - Sharp centered copy (contain on desktop, cover on mobile)
       - Big centered Play button over the paused first frame
       - Corner controls appear on tap/hover
       ============================================ -->
  <section class="fullscreen-video-section" id="fsVideoSection" aria-label="Full-screen video player">

    <!-- Blurred fill copy (decorative, muted, silent) -->
    <video
      class="fs-fill"
      id="fillVideo"
      muted
      playsinline
      preload="auto"
    >
      <source src="ssstik.io_%40grimzessae_1791710228291.mp4" type="video/mp4" />
    </video>

    <!-- Sharp centered copy (the one JS syncs with the MP3) -->
    <video
      id="myVideo"
      class="fs-sharp"
      muted
      playsinline
      preload="auto"
    >
      <source src="ssstik.io_%40grimzessae_1791710228291.mp4" type="video/mp4" />
      <p>Your browser does not support HTML5 video. Please upgrade to a modern browser.</p>
    </video>

    <!-- Subtle gradient overlay for text readability -->
    <div class="fs-overlay" aria-hidden="true"></div>

    <!-- Big centered Play button -->
    <button
      class="big-play"
      id="bigPlayBtn"
      type="button"
      aria-label="Play video with sound"
      title="Play"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5.14v13.72c0 .79.87 1.27 1.54.84l10.5-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z"></path>
      </svg>
    </button>

    <!-- Corner controls: pause/play, mute/unmute, fullscreen -->
    <div class="corner-controls" id="cornerControls">
      <!-- Play / Pause -->
      <button
        class="control-btn"
        id="playPauseBtn"
        type="button"
        aria-label="Pause"
        title="Pause"
      >
        <svg id="pauseIcon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="4" width="4" height="16" rx="1"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1"></rect>
        </svg>
        <svg id="playIcon" class="hidden" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5.14v13.72c0 .79.87 1.27 1.54.84l10.5-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z"></path>
        </svg>
      </button>

      <!-- Mute / Unmute -->
      <button
        class="control-btn"
        id="muteBtn"
        type="button"
        aria-label="Mute audio"
        title="Mute"
      >
        <svg id="mutedIcon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10v4h4l5 5V5L7 10H3z"></path>
          <line x1="17" y1="9" x2="21" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <line x1="21" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
        </svg>
        <svg id="unmutedIcon" class="hidden" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10v4h4l5 5V5L7 10H3z"></path>
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"></path>
          <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path>
        </svg>
      </button>

      <!-- Enter / Exit fullscreen (manual only) -->
      <button
        class="control-btn"
        id="fsToggleBtn"
        type="button"
        aria-label="Enter fullscreen"
        title="Fullscreen"
      >
        <svg id="fsEnterIcon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"></path>
        </svg>
        <svg id="fsExitIcon" class="hidden" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 4v4H6v2h6V4h-2zm4 0h-2v6h6V8h-4V4zM4 14v2h4v4h2v-6H4zm10 0v6h2v-4h4v-2h-6z"></path>
        </svg>
      </button>
    </div>

    <!-- Fallback message -->
    <div class="video-fallback" id="fallbackMsg">
      ⚠️ Your browser cannot play this video or audio.<br />
      Please try a modern browser or download the files.
    </div>
  </section>

  <!-- Hidden MP3: the only sound source -->
  <audio
    id="myAudio"
    preload="auto"
    src="SaveTik.io_7687661810236869909.mp3"
  ></audio>

  <!-- ============================================
       Vanilla JS
       - Big Play button starts video + MP3 together,
         resets both, hides button (NO auto fullscreen)
       - Loop sync via "ended" (no reliance on native loop)
       - Corner controls: pause/play, mute/unmute, fullscreen (manual)
       - visibilitychange: pause/resume both after start
       - Fallback detection
       ============================================ -->
  <script>
    (function () {
      "use strict";

      /* ---------- DOM references ---------- */
      const section = document.getElementById("fsVideoSection");
      const video = document.getElementById("myVideo");       // sharp copy
      const fillVideo = document.getElementById("fillVideo"); // blurred copy
      const audio = document.getElementById("myAudio");
      const bigPlayBtn = document.getElementById("bigPlayBtn");
      const playPauseBtn = document.getElementById("playPauseBtn");
      const muteBtn = document.getElementById("muteBtn");
      const fsToggleBtn = document.getElementById("fsToggleBtn");
      const pauseIcon = document.getElementById("pauseIcon");
      const playIcon = document.getElementById("playIcon");
      const mutedIcon = document.getElementById("mutedIcon");
      const unmutedIcon = document.getElementById("unmutedIcon");
      const fsEnterIcon = document.getElementById("fsEnterIcon");
      const fsExitIcon = document.getElementById("fsExitIcon");

      let hasStarted = false;    // becomes true after first Play press
      let userPaused = false;    // true when user explicitly paused

      /* ---------- 1. Fallback detection ---------- */
      video.addEventListener("error", function () {
        section.classList.add("fallback-active");
      });
      audio.addEventListener("error", function () {
        section.classList.add("fallback-active");
      });
      if (video.canPlayType && video.canPlayType("video/mp4") === "") {
        section.classList.add("fallback-active");
      }

      /* ---------- 2. Play / pause helpers ---------- */
      function playBoth() {
        return Promise.all([
          video.play().catch(function () {}),
          audio.play().catch(function () {})
        ]);
      }

      function pauseBoth() {
        video.pause();
        audio.pause();
        if (fillVideo && !fillVideo.paused) fillVideo.pause();
      }

      /* ---------- 3. Loop sync: restart MP3 with the video ---------- */
      video.addEventListener("ended", function () {
        try { video.currentTime = 0; } catch (e) {}
        try { audio.currentTime = 0; } catch (e) {}
        if (hasStarted && !userPaused) playBoth();
      });

      video.addEventListener("timeupdate", function () {
        if (!hasStarted || video.paused) return;
        const drift = Math.abs(video.currentTime - audio.currentTime);
        if (drift > 0.35) {
          try { audio.currentTime = video.currentTime; } catch (e) {}
        }
      });

      video.addEventListener("timeupdate", function () {
        if (!fillVideo || fillVideo.paused) return;
        const d = Math.abs(fillVideo.currentTime - video.currentTime);
        if (d > 0.5) {
          try { fillVideo.currentTime = video.currentTime; } catch (e) {}
        }
      });

      /* ---------- 4. BIG PLAY BUTTON ---------- */
      bigPlayBtn.addEventListener("click", function (e) {
        e.stopPropagation();

        video.muted = true;

        try { video.currentTime = 0; } catch (err) {}
        try { audio.currentTime = 0; } catch (err) {}

        playBoth();

        if (fillVideo) {
          try { fillVideo.currentTime = 0; } catch (err) {}
          const fp = fillVideo.play();
          if (fp && fp.catch) fp.catch(function () {});
        }

        bigPlayBtn.classList.add("is-hidden");

        hasStarted = true;
        userPaused = false;
        updatePlayPauseUI();
        showControlsTemporarily();
      });

      /* ---------- 5. Fullscreen helpers (manual only) ---------- */
      function requestFullscreenSafe(el) {
        const fn = el.requestFullscreen
          || el.webkitRequestFullscreen
          || el.msRequestFullscreen;
        if (typeof fn === "function") {
          try {
            const p = fn.call(el);
            if (p && typeof p.catch === "function") p.catch(function () {});
          } catch (err) {}
        }
      }

      function exitFullscreenSafe() {
        const fn = document.exitFullscreen
          || document.webkitExitFullscreen
          || document.msExitFullscreen;
        if (typeof fn === "function") {
          try {
            const p = fn.call(document);
            if (p && typeof p.catch === "function") p.catch(function () {});
          } catch (err) {}
        }
      }

      function isFullscreen() {
        return !!(document.fullscreenElement
          || document.webkitFullscreenElement
          || document.msFullscreenElement);
      }

      function updateFsIcon() {
        if (isFullscreen()) {
          fsEnterIcon.classList.add("hidden");
          fsExitIcon.classList.remove("hidden");
          fsToggleBtn.setAttribute("aria-label", "Exit fullscreen");
          fsToggleBtn.title = "Exit fullscreen";
        } else {
          fsEnterIcon.classList.remove("hidden");
          fsExitIcon.classList.add("hidden");
          fsToggleBtn.setAttribute("aria-label", "Enter fullscreen");
          fsToggleBtn.title = "Fullscreen";
        }
      }

      fsToggleBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (isFullscreen()) exitFullscreenSafe();
        else requestFullscreenSafe(section);
        showControlsTemporarily();
      });

      ["fullscreenchange", "webkitfullscreenchange", "msfullscreenchange"]
        .forEach(function (evt) {
          document.addEventListener(evt, updateFsIcon);
        });

      /* ---------- 6. Play / Pause UI (corner) ---------- */
      function updatePlayPauseUI() {
        if (video.paused) {
          pauseIcon.classList.add("hidden");
          playIcon.classList.remove("hidden");
          playPauseBtn.setAttribute("aria-label", "Play");
          playPauseBtn.title = "Play";
        } else {
          pauseIcon.classList.remove("hidden");
          playIcon.classList.add("hidden");
          playPauseBtn.setAttribute("aria-label", "Pause");
          playPauseBtn.title = "Pause";
        }
      }

      playPauseBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (video.paused) {
          userPaused = false;
          try { audio.currentTime = video.currentTime; } catch (err) {}
          playBoth();
          if (fillVideo) {
            const fp = fillVideo.play();
            if (fp && fp.catch) fp.catch(function () {});
          }
        } else {
          userPaused = true;
          pauseBoth();
        }
        updatePlayPauseUI();
        showControlsTemporarily();
      });

      video.addEventListener("play", updatePlayPauseUI);
      video.addEventListener("pause", updatePlayPauseUI);

      /* ---------- 7. Mute / Unmute UI (controls MP3) ---------- */
      function updateMuteUI() {
        if (audio.muted) {
          mutedIcon.classList.remove("hidden");
          unmutedIcon.classList.add("hidden");
          muteBtn.setAttribute("aria-label", "Unmute audio");
          muteBtn.title = "Unmute";
        } else {
          mutedIcon.classList.add("hidden");
          unmutedIcon.classList.remove("hidden");
          muteBtn.setAttribute("aria-label", "Mute audio");
          muteBtn.title = "Mute";
        }
      }

      muteBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        audio.muted = !audio.muted;
        updateMuteUI();
        showControlsTemporarily();
      });

      audio.addEventListener("volumechange", updateMuteUI);

      /* ---------- 8. Controls auto-hide ---------- */
      let hideTimer = null;
      function showControlsTemporarily() {
        section.classList.add("controls-visible");
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(function () {
          if (!video.paused) section.classList.remove("controls-visible");
        }, 3000);
      }

      section.addEventListener("mousemove", function () {
        if (!window.matchMedia("(hover: none)").matches) {
          section.classList.add("controls-visible");
          if (hideTimer) clearTimeout(hideTimer);
          hideTimer = setTimeout(function () {
            if (!video.paused) section.classList.remove("controls-visible");
          }, 3000);
        }
      });

      section.addEventListener(
        "touchstart",
        function () {
          if (window.matchMedia("(hover: none)").matches) {
            section.classList.add("controls-visible");
            showControlsTemporarily();
          }
        },
        { passive: true }
      );

      video.addEventListener("click", function () {
        if (!hasStarted) return;
        section.classList.toggle("controls-visible");
        if (section.classList.contains("controls-visible")) showControlsTemporarily();
      });

      /* ---------- 9. Tab visibility: pause / resume both ---------- */
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          if (!video.paused) pauseBoth();
        } else {
          if (hasStarted && !userPaused) {
            playBoth();
            if (fillVideo) {
              const fp = fillVideo.play();
              if (fp && fp.catch) fp.catch(function () {});
            }
          }
        }
      });

      /* ---------- 10. Initial UI state ---------- */
      updatePlayPauseUI();
      updateMuteUI();
      updateFsIcon();
    })();
  </script>

</body>
